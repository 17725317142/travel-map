<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旅程地图</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin=""
    />
    <style>
      :root {
        --ink: #203735;
        --ink-soft: #49645f;
        --muted: #778984;
        --line: #d9e5de;
        --panel: rgba(255, 253, 248, 0.93);
        --panel-strong: #fffdf8;
        --green: #0f7667;
        --green-dark: #07584d;
        --green-pale: #e5f4ed;
        --gold: #e0a74c;
        --rose: #db735e;
        --airport: #7367d8;
        --station: #3184c7;
        --hotel: #c86e3b;
        --spot: #139878;
        --food: #c95379;
        --shadow: 0 18px 46px rgba(22, 55, 48, 0.16);
        --shadow-soft: 0 8px 24px rgba(22, 55, 48, 0.11);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 860px;
        color: var(--ink);
        background: #e7f0ea;
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          border-color 0.18s ease,
          background 0.18s ease,
          color 0.18s ease;
      }
      button:active {
        transform: translateY(1px);
      }
      ::selection {
        color: #fff;
        background: var(--green);
      }
      .app {
        height: 100vh;
        min-height: 650px;
        display: grid;
        grid-template-rows: 76px 1fr;
      }
      .topbar {
        position: relative;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        background: linear-gradient(
          105deg,
          rgba(255, 253, 248, 0.98),
          rgba(247, 252, 248, 0.94)
        );
        border-bottom: 1px solid rgba(217, 229, 222, 0.9);
        box-shadow: 0 4px 22px rgba(30, 70, 60, 0.08);
        backdrop-filter: blur(16px);
      }
      .topbar:after {
        position: absolute;
        right: 0;
        bottom: -1px;
        left: 0;
        height: 2px;
        content: "";
        background: linear-gradient(
          90deg,
          var(--green),
          #50b38d 45%,
          var(--gold) 82%,
          transparent
        );
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(145deg, #16a080, var(--green-dark));
        border: 2px solid rgba(255, 255, 255, 0.72);
        border-radius: 13px;
        box-shadow: 0 7px 16px rgba(15, 118, 103, 0.28);
        font-size: 22px;
        font-weight: 700;
        transform: rotate(-6deg);
      }
      .brand-mark::first-letter {
        display: block;
      }
      .brand > div:last-child {
        display: grid;
        gap: 2px;
      }
      h1 {
        margin: 0;
        font-family: "Songti SC", "STSong", serif;
        font-size: 22px;
        letter-spacing: 0.08em;
        line-height: 1;
      }
      .draft-label {
        letter-spacing: 0.025em;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .layer-switch {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 11px 6px 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.56);
        font-size: 12px;
        font-weight: 800;
      }
      .layer-select {
        min-width: 140px;
        padding: 4px 21px 4px 2px;
        border: 0;
        color: var(--ink);
        background: transparent;
        outline: none;
        font-weight: 650;
      }
      .layer-select:focus,
      .control:focus,
      .note-input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 4px rgba(15, 118, 103, 0.12);
      }
      .button {
        border: 1px solid var(--line);
        color: var(--ink);
        background: rgba(255, 255, 255, 0.82);
        border-radius: 10px;
        padding: 9px 13px;
        font-size: 13px;
        font-weight: 650;
        box-shadow: 0 2px 0 rgba(32, 55, 53, 0.02);
      }
      .button:hover {
        border-color: #a8cbbd;
        color: var(--green-dark);
        background: #fbfffc;
        box-shadow: 0 5px 13px rgba(20, 89, 71, 0.12);
        transform: translateY(-1px);
      }
      .button.primary {
        color: #fff;
        background: linear-gradient(135deg, #13947b, var(--green-dark));
        border-color: var(--green-dark);
        font-weight: 800;
        box-shadow: 0 7px 16px rgba(15, 118, 103, 0.22);
      }
      .button.primary:hover {
        color: #fff;
        background: linear-gradient(135deg, #16a488, #075047);
        box-shadow: 0 9px 19px rgba(15, 118, 103, 0.3);
      }
      #map {
        height: 100%;
        width: 100%;
        z-index: 1;
        background: #d9e9df;
      }
      .leaflet-control-attribution {
        font-size: 10px;
      }
      .leaflet-control-zoom {
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.8) !important;
        border-radius: 12px !important;
        box-shadow: var(--shadow-soft) !important;
      }
      .leaflet-control-zoom a {
        width: 37px !important;
        height: 37px !important;
        line-height: 35px !important;
        color: var(--ink) !important;
        border-color: var(--line) !important;
        background: rgba(255, 253, 248, 0.96) !important;
      }
      .leaflet-control-zoom a:hover {
        color: var(--green) !important;
        background: #fff !important;
      }
      .leaflet-bottom.leaflet-right {
        margin: 0 14px 10px 0;
      }
      .leaflet-top.leaflet-left {
        margin: 15px 0 0 15px;
      }
      .panel {
        position: absolute;
        z-index: 600;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 18px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }
      .add-panel {
        left: 24px;
        top: 22px;
        width: 304px;
        padding: 18px;
      }
      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .panel h2 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.04em;
      }
      .panel-toggle {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 10px;
        border: 1px solid #b7d7c8;
        border-radius: 8px;
        color: var(--green);
        background: #f8fffb;
        font-size: 11px;
        font-weight: 850;
        box-shadow: 0 2px 5px rgba(23, 107, 88, 0.08);
        white-space: nowrap;
      }
      .panel-toggle:hover {
        color: #fff;
        background: var(--green);
        border-color: var(--green);
        box-shadow: 0 5px 11px rgba(15, 118, 103, 0.2);
      }
      .field + .field {
        margin-top: 13px;
      }
      label {
        display: block;
        margin-bottom: 7px;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.03em;
      }
      .control {
        width: 100%;
        padding: 10px 11px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.83);
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease,
          background 0.18s ease;
      }
      .control::placeholder {
        color: #a2b1ac;
      }
      .add-panel .button {
        width: 100%;
        margin-top: 16px;
      }
      .help {
        min-height: 16px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }
      .is-adding .button.primary {
        background: linear-gradient(135deg, #e89a59, #c96a4c);
        border-color: #c96a4c;
      }
      .search-row {
        display: grid;
        grid-template-columns: 1fr 42px;
        gap: 7px;
      }
      .search-button {
        display: grid;
        place-items: center;
        border: 1px solid var(--green);
        border-radius: 10px;
        color: #fff;
        background: linear-gradient(135deg, #15977d, var(--green-dark));
        font-size: 18px;
        box-shadow: 0 5px 11px rgba(15, 118, 103, 0.19);
      }
      .search-button:hover {
        background: var(--green-dark);
        transform: translateY(-1px);
      }
      .search-results {
        display: none;
        max-height: 210px;
        margin-top: 10px;
        overflow: auto;
        border-top: 1px solid var(--line);
      }
      .search-results.is-open {
        display: block;
      }
      .search-status {
        padding: 10px 2px;
        color: var(--muted);
        font-size: 11px;
      }
      .search-result {
        width: 100%;
        display: block;
        padding: 10px 5px;
        border: 0;
        border-bottom: 1px solid #edf2ee;
        color: var(--ink);
        background: transparent;
        text-align: left;
      }
      .search-result:hover {
        background: var(--green-pale);
      }
      .search-result-name {
        display: block;
        font-size: 12px;
        font-weight: 800;
      }
      .search-result-address {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }
      .detail-panel {
        right: 350px;
        top: 22px;
        width: 282px;
        padding: 18px;
      }
      .detail-panel[hidden] {
        display: none;
      }
      .close,
      .mini-button {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 3px;
        font-size: 20px;
        line-height: 1;
      }
      .close:hover,
      .mini-button:hover {
        color: var(--rose);
        transform: scale(1.12);
      }
      .detail-type {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }
      .detail-type-select {
        min-width: 82px;
        padding: 3px 20px 3px 5px;
        border: 1px solid transparent;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        outline: none;
        font-size: 12px;
        font-weight: 800;
      }
      .detail-type-select:hover,
      .detail-type-select:focus {
        border-color: var(--line);
        color: var(--green-dark);
        background: #fff;
        box-shadow: 0 0 0 3px rgba(15, 118, 103, 0.1);
      }
      .type-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--spot);
        box-shadow: 0 0 0 4px rgba(19, 152, 120, 0.13);
      }
      .detail-name {
        margin: 11px 0 14px;
        font-family: "Songti SC", "STSong", serif;
        font-size: 22px;
        letter-spacing: 0.03em;
      }
      .note-input {
        width: 100%;
        min-height: 70px;
        resize: vertical;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.82);
        font:
          12px/1.5 Inter,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        outline: none;
      }
      .order-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 15px;
      }
      .small-button {
        padding: 8px;
        border: 1px solid var(--line);
        color: var(--ink-soft);
        background: rgba(255, 255, 255, 0.78);
        border-radius: 8px;
        font-size: 12px;
        font-weight: 650;
      }
      .small-button:hover:not(:disabled) {
        color: var(--green);
        border-color: #9bc7b5;
        background: #fbfffc;
      }
      .small-button:disabled {
        cursor: not-allowed;
        color: #b5c2bf;
        background: #f5f8f7;
      }
      .delete {
        width: 100%;
        margin-top: 10px;
        padding: 7px;
        border: 0;
        background: transparent;
        color: #bf4b4a;
        font-size: 12px;
        font-weight: 650;
      }
      .delete:hover {
        color: #a43035;
        background: #fff4f3;
        border-radius: 8px;
      }
      .itinerary-sidebar {
        right: 0;
        top: 22px;
        bottom: 28px;
        width: 320px;
        padding: 17px;
        overflow: auto;
        border-radius: 14px 0 0 14px;
      }
      .itinerary-sidebar::-webkit-scrollbar,
      .search-results::-webkit-scrollbar,
      .draft-list::-webkit-scrollbar {
        width: 7px;
      }
      .itinerary-sidebar::-webkit-scrollbar-thumb,
      .search-results::-webkit-scrollbar-thumb,
      .draft-list::-webkit-scrollbar-thumb {
        background: #c8d9d1;
        border-radius: 99px;
      }
      .sidebar-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 14px;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 850;
        letter-spacing: 0.06em;
      }
      .side-action {
        padding: 5px 8px;
        border: 1px solid #b7d7c8;
        border-radius: 7px;
        color: var(--green);
        background: #f8fffb;
        font-size: 11px;
        font-weight: 800;
      }
      .side-action:hover {
        color: #fff;
        background: var(--green);
        border-color: var(--green);
      }
      .trip-group {
        margin: 0 0 14px;
      }
      .trip-row,
      .day-row,
      .place-row {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .collapse-toggle {
        width: 20px;
        height: 25px;
        flex: 0 0 20px;
        padding: 0;
        border: 0;
        color: var(--green);
        background: transparent;
        font-size: 16px;
        line-height: 1;
      }
      .collapse-toggle:hover {
        color: var(--green-dark);
        transform: scale(1.15);
      }
      .trip-row {
        padding: 10px 9px;
        background: linear-gradient(100deg, #def2e9, #f4fbf7);
        border: 1px solid rgba(186, 218, 204, 0.65);
        border-radius: 11px;
        box-shadow: 0 2px 7px rgba(27, 91, 70, 0.05);
      }
      .trip-title,
      .day-title {
        min-width: 0;
        flex: 1;
        color: var(--ink);
        background: transparent;
        border: 0;
        outline: none;
        font-weight: 800;
      }
      .trip-title {
        font-size: 14px;
      }
      .day-title {
        font-size: 12px;
      }
      .trip-title:focus,
      .day-title:focus {
        background: #fff;
        box-shadow: 0 0 0 3px rgba(15, 118, 103, 0.15);
        border-radius: 6px;
      }
      .visibility-button {
        width: 25px;
        height: 25px;
        flex: 0 0 25px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 7px;
        color: var(--green);
        background: rgba(255, 255, 255, 0.57);
      }
      .visibility-button:hover {
        color: #fff;
        background: var(--green);
      }
      .visibility-button.is-hidden {
        color: #b4c1be;
        text-decoration: line-through;
      }
      .days {
        margin: 8px 0 0 11px;
        padding-left: 11px;
        border-left: 1px solid #c8ddd3;
      }
      .days.is-collapsed,
      .place-list.is-collapsed {
        display: none;
      }
      .day-group + .day-group {
        margin-top: 8px;
      }
      .day-row {
        padding: 5px 0;
      }
      .place-list {
        min-height: 22px;
        margin: 0 0 2px 31px;
      }
      .place-row {
        width: 100%;
        padding: 6px 5px;
        border: 0;
        color: var(--ink);
        background: transparent;
        text-align: left;
        border-radius: 7px;
        font-size: 12px;
      }
      .place-row:hover,
      .place-row.is-selected,
      .place-row.is-drag-over {
        background: var(--green-pale);
      }
      .place-row.is-selected {
        font-weight: 800;
        box-shadow: inset 3px 0 var(--green);
      }
      .place-row[draggable="true"] {
        cursor: grab;
      }
      .place-row.is-dragging {
        opacity: 0.4;
      }
      .place-dot {
        width: 8px;
        height: 8px;
        flex: 0 0 8px;
        border-radius: 50%;
        background: var(--spot);
        box-shadow: 0 0 0 3px rgba(19, 152, 120, 0.1);
      }
      .place-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .place-order {
        margin-left: auto;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
      }
      .segment-editor {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 2px 0 2px 8px;
        padding: 4px 4px 4px 10px;
        border-left: 1px dashed #a6cdbd;
        color: var(--muted);
        font-size: 10px;
      }
      .segment-editor::before {
        content: "↓";
        color: var(--green);
        font-size: 12px;
      }
      .transport-select {
        min-width: 0;
        flex: 1;
        padding: 4px 5px;
        border: 1px solid #d5e2de;
        border-radius: 6px;
        color: #436760;
        background: #fbfdfc;
        font-size: 10px;
      }
      .custom-transport {
        width: 90px;
        padding: 4px 5px;
        border: 1px solid #d5e2de;
        border-radius: 6px;
        color: #436760;
        background: #fff;
        font-size: 10px;
      }
      .drop-target {
        outline: 1px dashed var(--green);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .add-day {
        width: 100%;
        margin: 7px 0 1px;
        padding: 6px;
        border: 1px dashed #9ec9b7;
        border-radius: 8px;
        color: var(--green);
        background: rgba(246, 253, 249, 0.65);
        font-size: 11px;
        font-weight: 750;
      }
      .add-day:hover {
        background: var(--green-pale);
        border-color: var(--green);
      }
      .map-pin {
        --pin: var(--spot);
        position: relative;
        width: 40px;
        height: 48px;
        display: grid;
        place-items: start center;
        pointer-events: auto;
      }
      .pin-shape {
        width: 37px;
        height: 37px;
        display: grid;
        place-items: center;
        border: 3px solid #fff;
        border-radius: 50% 50% 50% 8px;
        transform: rotate(-45deg);
        color: #fff;
        background: var(--pin);
        box-shadow: 0 6px 15px rgba(17, 46, 40, 0.3);
        font-size: 15px;
        font-weight: 700;
      }
      .pin-shape span {
        transform: rotate(45deg);
      }
      .pin-order {
        position: absolute;
        right: -4px;
        top: -5px;
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        border: 2px solid #fff;
        border-radius: 50%;
        color: #fff;
        background: var(--green-dark);
        font-size: 9px;
        font-weight: 800;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.18);
      }
      .pin-label {
        position: absolute;
        top: 41px;
        left: 21px;
        color: var(--ink);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
        text-shadow:
          0 1px 0 #fff,
          1px 0 0 #fff,
          -1px 0 0 #fff;
      }
      .pin-note {
        position: absolute;
        z-index: 10;
        top: 59px;
        left: 20px;
        max-width: 155px;
        padding: 3px 6px;
        overflow: hidden;
        border: 1px solid rgba(215, 187, 104, 0.35);
        border-radius: 5px;
        color: #72572b;
        background: rgba(255, 248, 211, 0.97);
        font:
          11px/1.25 Inter,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        white-space: nowrap;
        text-overflow: ellipsis;
        box-shadow: 0 3px 8px rgba(80, 61, 17, 0.16);
        transform: translate(var(--note-x, 0px), var(--note-y, 0px));
        cursor: grab;
        touch-action: none;
        user-select: none;
        pointer-events: auto;
      }
      .pin-note.is-dragging {
        cursor: grabbing;
      }
      .place-note {
        display: block;
        margin: -1px 5px 5px 17px;
        overflow: hidden;
        color: #8a6c32;
        font-size: 10px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .marker-selected .pin-shape {
        outline: 5px solid rgba(15, 118, 103, 0.23);
      }
      .route-halo {
        stroke: #fff;
        stroke-width: 8;
        stroke-opacity: 0.82;
      }
      .route-path {
        stroke: var(--green);
        stroke-width: 3.5;
        stroke-dasharray: 7 7;
        stroke-opacity: 0.92;
      }
      .navigation-halo {
        stroke: #fff;
        stroke-width: 9;
        stroke-opacity: 0.84;
      }
      .navigation-path {
        stroke: #0f7667;
        stroke-width: 4.5;
        stroke-opacity: 0.97;
      }
      .distance-label {
        padding: 3px 6px;
        border: 1px solid #d4e0dc;
        border-radius: 6px;

      /* 收起控件始终位于面板最上层，避免地图手势层或标题布局截获点击。 */
      .panel-title,
      .sidebar-heading {
        position: relative;
        isolation: isolate;
      }
      .panel-title {
        z-index: 3;
      }
      .sidebar-heading {
        z-index: 3;

      .sidebar-heading > span {
        display: flex;

      /* 原生开关：即使地图脚本或网络资源异常，左右栏也仍可收起与展开。 */
      .panel-state {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        clip-path: inset(50%);
        opacity: 0;
        pointer-events: none;
      }
      #searchPanelState:checked ~ .add-panel {
        display: none !important;

      #sidebarPanelState:checked ~ .itinerary-sidebar {
        display: none !important;
      }
      #searchPanelState:checked ~ .reopen-search,
      #sidebarPanelState:checked ~ .reopen-sidebar {
        display: block !important;
        pointer-events: auto;
      }
      label.panel-toggle,
      label.edge-reopen {
        user-select: none;

      /* 浮层相对 .app 定位，需避开 76px 高的顶部导航；否则标题与收起按钮会被导航栏盖住。 */

      .detail-panel,

      .free-map-note {

        background: #fff8c9;

          600 13px/1.5 Inter,

        opacity: 1;

        pointer-events: auto;

      .free-note-resizer {

        bottom: 3px;

  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">⌁</div>
          <div>
            <h1>我的旅程</h1>
            <span class="draft-label" id="draftLabel">未命名 · 未保存</span>
          </div>
        </div>
        <div class="top-actions">
          <button class="button map-note-control" id="addMapNote" type="button">＋ 添加便签</button>
          <button class="button" id="exportImage" type="button">导出图片</button>
          <label class="layer-switch" for="layerMode"
            ><span>图层</span
            ><select class="layer-select" id="layerMode">
              <option value="all">第一层 · 全部</option>
              <option value="subdued">第二层 · 淡化地图</option>
              <option value="map">第三层 · 只有地图</option>
              <option value="annotations">第四层 · 只有标注</option>
              <option value="navigation">第五层 · 高德驾车导航</option>
            </select></label
          ><button class="button" id="fitMap" type="button">查看全部</button
          ><button class="button" id="openDrafts" type="button">打开草稿</button
          ><button class="button primary" id="savePlan" type="button">
            保存草稿
          </button>
        </div>
      </header>
      <input
        class="panel-state"
        id="searchPanelState"
        type="checkbox"
        aria-label="切换搜索栏显示状态"
      />
      <input
        class="panel-state"
        id="sidebarPanelState"
        type="checkbox"
        aria-label="切换行程目录显示状态"
      />
      <section id="map" aria-label="旅行地点真实地图"></section>
      <form class="panel add-panel" id="addForm">
        <div class="panel-title">
          <h2>添加地点</h2>
          <label
            class="panel-toggle"
            id="toggleSearch"
            for="searchPanelState"
            role="button"
            tabindex="0"
            aria-label="隐藏搜索栏"
            title="收起搜索栏"
            >◀ 收起</label
          >
        </div>
        <div class="field">
          <label for="placeName">搜索或输入地点</label>
          <div class="search-row">
            <input
              id="placeName"
              class="control"
              maxlength="50"
              placeholder="例如：故宫博物院"
              autocomplete="off"
            /><button
              class="search-button"
              id="searchPlaces"
              type="button"
              aria-label="搜索地点"
            >
              ⌕
            </button>
          </div>
          <div
            class="search-results"
            id="searchResults"
            aria-live="polite"
          ></div>
        </div>
        <div class="field">
          <label for="placeType">地点类型</label
          ><select id="placeType" class="control">
            <option value="airport">✈ 机场</option>
            <option value="station">▣ 车站</option>
            <option value="hotel">⌂ 酒店</option>
            <option value="spot" selected>◆ 景点</option>
            <option value="food">● 餐饮</option>
          </select>
        </div>
        <div class="field">
          <label for="placeDay">归入行程</label
          ><select id="placeDay" class="control"></select>
        </div>
        <button class="button primary" id="startAdd" type="submit">
          在地图上标记
        </button>
      </form>
      <aside class="panel detail-panel" id="detailPanel" hidden>
        <div class="panel-title">
          <div class="detail-type">
            <i class="type-dot" id="detailDot"></i
            ><select class="detail-type-select" id="detailTypeInput" aria-label="修改地点类型">
              <option value="airport">✈ 机场</option>
              <option value="station">▣ 车站</option>
              <option value="hotel">⌂ 酒店</option>
              <option value="spot">◆ 景点</option>
              <option value="food">● 餐饮</option>
            </select>
          </div>
          <button class="close" id="closeDetail" type="button">×</button>
        </div>
        <h2 class="detail-name" id="detailName">地点名称</h2>
        <textarea
          class="note-input"
          id="placeNote"
          maxlength="120"
          placeholder="便签，例如：08:35 抵达 / 14:10 高铁出发"
        ></textarea>

              class="panel-toggle"
              id="toggleSidebar"
              for="sidebarPanelState"
              role="button"
              tabindex="0"

            导入草稿</button

            id="importFile"
            type="file"
            accept=".json,application/json"

          />
        </div>
        <p class="storage-status" id="storageStatus">正在检测数据存储位置…</p>
      </aside>
      <p class="navigation-note" id="navigationNote" hidden>

      </p>

      function drawNavigationResult({

          color = day.color;
        if (mode === "custom") {
          const line = [
              [from.lat, from.lng],
              [to.lat, to.lng],
            ],
            mid = [(from.lat + to.lat) / 2, (from.lng + to.lng) / 2];

            L.polyline(line, {
              color,
              weight: 3.5,
              opacity: 0.9,
              interactive: false,

      async function renderNavigation() {
        clearNavigation();
        const segments = visibleSegments();
        if (!segments.length) {
          $("navigationNote").textContent =
            "至少需要两个按目录顺序排列的可见地点才能生成导航线路。";
          $("navigationNote").hidden = false;
          return;
        }
        const batches = navigationBatches(segments);
        $("navigationNote").textContent =
          `正在分 ${batches.length} 批生成导航（每批最多 6 个地点）…`;
        $("navigationNote").hidden = false;
        navigationController = new AbortController();
        try {
          const results = [],
            failures = [];
          for (let i = 0; i < batches.length; i++) {
            const batch = batches[i];
            $("navigationNote").textContent =
              `正在计算第 ${i + 1}/${batches.length} 批（${batch.length + 1} 个地点）…`;
            for (const segment of batch) {
              try {
                results.push(await calculateNavigationSegment(segment));
              } catch (e) {
                if (e.name === "AbortError") throw e;
                failures.push({ segment, message: e.message });
              }
              if (!navigationController.signal.aborted)
                await navigationPause(180);
            }
          }
          if (!results.length)
            throw new Error(failures[0]?.message || "未找到可用路线");
          results.forEach(drawNavigationResult);
          renderRouteOptionsPanel();

            `导航 · 已生成 ${results.length}/${segments.length} 段路线${failures.length ? `，${failures.length} 段未生成` : ""}`;
          setTimeout(
            () => {
              $("navigationNote").hidden = true;
            },
            failures.length ? 5200 : 2600,
          );

          if (e.name === "AbortError") return;
          $("navigationNote").textContent = `导航未生成：${e.message}`;

      function enableNoteDrag(marker, place) {
        const el = marker.getElement?.(),
          note = el?.querySelector?.("[data-note-place]");

        const stop = (event) => {
          event.preventDefault();
          event.stopPropagation();
        };
        const move = (event) => {
          if (!drag) return;
          stop(event);
          const x = Math.round(drag.offset.x + event.clientX - drag.x),
            y = Math.round(drag.offset.y + event.clientY - drag.y);
          place.noteOffset = { x, y };
          note.style.setProperty("--note-x", `${x}px`);
          note.style.setProperty("--note-y", `${y}px`);
        };
        const end = (event) => {
          if (!drag) return;
          stop(event);
          drag = null;
          note.classList.remove("is-dragging");
          map.dragging.enable();
          document.removeEventListener("pointermove", move, true);
          document.removeEventListener("pointerup", end, true);
          document.removeEventListener("pointercancel", end, true);
        };
        note.addEventListener("pointerdown", (event) => {
          stop(event);
          drag = {
            x: event.clientX,
            y: event.clientY,
            offset: { ...(place.noteOffset || { x: 0, y: 0 }) },
          };

          document.addEventListener("pointerup", end, true);

        };
        const resizeEnd = (event) => {
          if (!resizing) return;
          stop(event);
          resizing = null;
          card.classList.remove("is-resizing");

          map.dragging.disable();
          document.addEventListener("pointermove", resizeMove, true);
          document.addEventListener("pointerup", resizeEnd, true);
          document.addEventListener("pointercancel", resizeEnd, true);

        const end = (event) => {
          if (!dragging) return;
          stop(event);
          dragging = false;
          card.classList.remove("is-dragging");
          map.dragging.enable();
          document.removeEventListener("pointermove", move, true);
          document.removeEventListener("pointerup", end, true);
          document.removeEventListener("pointercancel", end, true);
          scheduleWorkspaceSave();
        };
        grip.addEventListener("pointerdown", (event) => {
          stop(event);
          dragging = true;
          card.classList.add("is-dragging");
          map.dragging.disable();
          document.addEventListener("pointermove", move, true);
          document.addEventListener("pointerup", end, true);
          document.addEventListener("pointercancel", end, true);
        });
      }
      function renderMapNotes() {

        sheet.setAttribute("aria-hidden", "true");
        const draftName = $("draftLabel").textContent || "我的旅程";
        sheet.innerHTML = `<header class="guide-export-header"><div><h1 class="guide-export-title">我的旅行攻略</h1><p class="guide-export-subtitle">${esc(draftName)}</p></div><p class="guide-export-time">导出时间：${new Date().toLocaleString("zh-CN")}</p></header><div class="guide-export-content"><div class="guide-export-map-frame"></div><section class="guide-export-itinerary"><h2>行程目录</h2></section></div><p class="guide-export-footer">地图数据 © OpenStreetMap contributors · 旅行地图</p>`;
        const mapFrame = sheet.querySelector(".guide-export-map-frame"),
          mapSource = $("map"),
          mapRect = mapSource.getBoundingClientRect(),
          mapClone = mapSource.cloneNode(true);
        mapClone.removeAttribute("id");
        mapClone.classList.add("guide-export-map");
        mapClone.style.width = `${Math.max(720, Math.round(mapRect.width))}px`;
        mapClone.style.height = `${Math.max(520, Math.round(mapRect.height))}px`;
        mapFrame.appendChild(mapClone);
        const itinerary = sheet.querySelector(".guide-export-itinerary"),
          groups = $("tripGroups").cloneNode(true);
        groups.id = "exportTripGroups";
        groups.querySelectorAll(".days, .place-list").forEach((el) =>
          el.classList.remove("is-collapsed"),
        );
        const sourceSelects = $("tripGroups").querySelectorAll("select"),
          exportSelects = groups.querySelectorAll("select");
        sourceSelects.forEach((select, i) => {
          if (exportSelects[i]) exportSelects[i].value = select.value;
        });
        itinerary.appendChild(groups);
        const routeList = $("routeOptionsList");
        if (routeList?.textContent.trim()) {
          const routeSection = document.createElement("section");
          routeSection.className = "guide-export-route-options";
          routeSection.innerHTML = "<h2>路线方案</h2>";
          routeSection.appendChild(routeList.cloneNode(true));
          itinerary.appendChild(routeSection);
        }
        document.body.appendChild(sheet);
        try {
          await waitForExportImages(sheet);
          const exportWidth = Math.ceil(sheet.getBoundingClientRect().width);
          const canvas = await html2canvas(sheet, {
            backgroundColor: "#edf4ef",
            scale: 2,
            useCORS: true,
            allowTaint: false,
            imageTimeout: 15000,
            logging: false,
            windowWidth: Math.max(window.innerWidth, exportWidth + 60),
            onclone: (doc) => {
              const clonedSheet = doc.querySelector("#guideExportSheet");
              if (clonedSheet) {
                clonedSheet.style.left = "0";
                clonedSheet.style.zIndex = "0";
              }
            },
          });
          const blob = await new Promise((resolve) =>
            canvas.toBlob(resolve, "image/png"),
          );
          if (!blob) throw new Error("图片生成失败");
          const url = URL.createObjectURL(blob),
            a = document.createElement("a");
          a.href = url;
          a.download = `旅行地图-攻略-${new Date().toISOString().slice(0, 10)}.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          button.textContent = "已导出图片";
          setTimeout(() => (button.textContent = originalText), 1600);
        } catch (e) {
          console.error("攻略图片导出失败", e);
          alert(`导出图片失败：${e.message || "请稍后重试"}`);
          button.textContent = originalText;
        } finally {
          sheet.remove();
          button.disabled = false;
        }
      }
      function importDraftsFile(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const d = JSON.parse(reader.result);
            if (!d || !Array.isArray(d.drafts))
              throw new Error("文件里没有草稿数据");
            const valid = d.drafts.filter(
              (x) =>
                x &&
                x.data &&
                Array.isArray(x.data.trips) &&
                Array.isArray(x.data.places),
            );
            drafts = valid.map((x) => ({
              id: Number.isFinite(+x.id) ? +x.id : uniqueId(),
              name: String(x.name || "").trim() || "未命名草稿",
              savedAt: +x.savedAt || Date.now(),
              data: x.data,
            }));
            activeDraftId = null;
            persistDrafts();
            const target = valid.length
              ? drafts.find((x) => String(x.id) === String(d.activeDraftId)) ||
                drafts[0]
              : null;
            if (target) openDraft(target.id);
            renderDraftList();
            updateDraftLabel();
          } catch (e) {
            alert("导入失败：" + e.message);
          }
        };
        reader.readAsText(file);
      }
      $("exportDrafts").addEventListener("click", exportDrafts);
      $("exportImage").addEventListener("click", exportGuideImage);
      $("importDrafts").addEventListener("click", () =>
        $("importFile").click(),
      );
      $("importFile").addEventListener("change", (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) importDraftsFile(f);
        e.target.value = "";
      });
      function saveNativePanelState(name, id) {
        $(id).addEventListener("change", () => {
          try {
            const s = JSON.parse(
              localStorage.getItem("travel-map-panels-v1") || "{}",
            );
            s[name] = $(id).checked;
            localStorage.setItem("travel-map-panels-v1", JSON.stringify(s));
          } catch (_) {}
        });
      }
      saveNativePanelState("search", "searchPanelState");
      saveNativePanelState("sidebar", "sidebarPanelState");
      $("calculateNavigation").addEventListener("click", () => {
        if (currentLayer !== "navigation") {
          $("layerMode").value = "navigation";
          applyLayer("navigation");
        }
        renderNavigation();
      });
      render();
      fitAll();
      applyLayer(currentLayer);
      updateDraftLabel();
      lastSavedJson = stateSnapshot();
      initRemote();
    </script>
  </body>
</html>
